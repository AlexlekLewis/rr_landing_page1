<!doctype html><html><head><meta charset="utf-8">
<!-- BREAK THE BOUNDARY FESTIVAL key art with event details. Promotional players: Jurel + Sooryavanshi only.
     ?f=feed|vert|sq  &loc=Torquay, Geelong | Torquay, Victoria -->
<style>
@font-face{font-family:M;src:url(../../fonts/montserrat-latin-900-italic.woff2);font-weight:900;font-style:italic}
@font-face{font-family:M;src:url(../../fonts/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:M;src:url(../../fonts/montserrat-latin-900-normal.woff2);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:M;color:#fff;position:relative;overflow:hidden;background:#000A24;width:1080px}
.l{position:absolute}
.pl{filter:drop-shadow(-10px 0 22px rgba(225,31,143,.5)) drop-shadow(12px 0 24px rgba(40,70,255,.55)) drop-shadow(0 30px 40px rgba(0,0,0,.6)) contrast(1.08) saturate(1.1)}
.d{z-index:6;background:linear-gradient(90deg,rgba(0,10,36,.9),rgba(0,10,36,.74));border-left:6px solid #E11F8F;backdrop-filter:blur(3px)}
.date{font:italic 900 1em M;text-transform:uppercase;line-height:1.08;letter-spacing:.01em}
.date b{color:#E11F8F;font-weight:900}
.row{display:flex;align-items:center;border-top:2px solid rgba(255,255,255,.22);font-weight:800;line-height:1.15}
.row i{font:normal 900 .8em M;color:#E11F8F;min-width:2em}
.foot{left:0;right:0;bottom:0;z-index:8;background:#001D48;display:flex;align-items:center;justify-content:space-between;padding:0 64px}
.foot b{font:normal 900 34px M;letter-spacing:.04em}.foot span{font-weight:800;font-size:26px;letter-spacing:.12em}
.grain{inset:0;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
</style><script src="btb-logo.js"></script></head><body><script>
const q=new URLSearchParams(location.search),F=q.get('f')||'feed',LOC=q.get('loc')||'Torquay, Geelong';
// lw/lx/ly: logo width, centre x, top. pt/pc/cx: players top, height, pair centre. d: details box [left, width, bottom gap above footer, font px]
const Z={feed:{H:1350,foot:14,lw:420,lx:274,ly:30,pt:190,pc:1300,cx:945,d:[64,456,34,24]},
         vert:{H:1920,foot:230,lw:480,lx:304,ly:236,pt:380,pc:1500,cx:1070,d:[64,480,50,26]},
         sq:{H:1080,foot:10,lw:286,lx:226,ly:18,pt:110,pc:1180,cx:820,d:[48,416,22,19.5]}}[F];
document.body.style.height=Z.H+'px';
const [dl,dw,dg,df]=Z.d, fade='linear-gradient(90deg,rgba(0,10,36,.96) 0%,rgba(0,10,36,.78) 36%,rgba(0,10,36,0) 62%),linear-gradient(180deg,rgba(0,10,36,.7) 0%,rgba(0,10,36,0) 22%)';
document.body.innerHTML=`<div class="l" style="inset:0;background:url(${q.get('v')==='coast'?'art/coast.jpg':'art/dusk.jpg'}) ${q.get('v')==='coast'?'center 60%':'30% 30%'}/cover;filter:saturate(1.2) brightness(.95)"></div>
<div class="l" style="inset:0;background:${fade}"></div>
<img class="l pl" id="a" src="../launch-2027/players/soorya-6645.png" style="height:${Z.pc}px;top:${Z.pt}px;z-index:3">
<img class="l pl" id="b" src="../launch-2027/players/jurel-0417.png" style="height:${Z.pc*.98}px;top:${Z.pt+Z.pc*.01}px;z-index:2">
<div class="l" style="left:0;right:0;bottom:0;height:${Math.round(Z.H*.22)}px;z-index:4;background:linear-gradient(180deg,rgba(0,10,36,0),rgba(0,10,36,.9))"></div>
<div class="l" id="lg" style="left:${Z.lx-Z.lw/2}px;top:${Z.ly}px;z-index:5;filter:drop-shadow(0 10px 40px rgba(0,10,36,.7))">${btbLogo(Z.lw,{loc:LOC})}</div>
<div class="l d" style="left:${dl}px;width:${dw}px;bottom:${Z.foot+dg}px;padding:${df*.9}px ${df*.9}px ${df*.5}px;font-size:${df}px">
  <div class="date" style="font-size:${df*1.42}px;margin-bottom:${df*.7}px">Sunday 17 <b>&amp;</b><br>Monday 18 January</div>
  <div class="row" style="padding:${df*.55}px 0"><i>01</i><span>T10 Senior Tournament</span></div>
  <div class="row" style="padding:${df*.55}px 0"><i>02</i><span>Junior and Senior Modern Cricket Coaching Clinic</span></div>
  <div class="row" style="padding:${df*.55}px 0"><i>03</i><span>Scholarship offers for players</span></div>
  <div class="row" style="padding:${df*.55}px 0"><i>04</i><span>Private coaching sessions with Rajasthan Royals IPL coaches awarded</span></div>
  <div class="row" style="padding:${df*.7}px 0 ${df*.3}px;gap:${df*.7}px;align-items:center">
    <img src="art/qr-break-the-boundary.svg" style="width:${df*5.2}px;height:${df*5.2}px;border-radius:8px;flex:none">
    <div><div style="font:normal 900 ${df*1.02}px M;color:#E11F8F;letter-spacing:.06em;text-transform:uppercase">Places are limited</div>
    <div style="font-weight:800;font-size:${df*.82}px;margin-top:${df*.25}px">Players welcome from around Victoria</div>
    <div style="font:italic 900 ${df*.95}px M;margin-top:${df*.4}px;letter-spacing:.08em">RRAMELBOURNE.COM</div></div>
  </div>
</div>

<div class="l grain" style="z-index:9"></div>`;
Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.load('italic 900 100px M')).then(()=>document.fonts.load('800 30px M')).then(()=>document.fonts.ready).then(()=>{
 const w=id=>document.getElementById(id).getBoundingClientRect().width, set=(id,x)=>document.getElementById(id).style.left=x+'px';
 set('a',Z.cx-w('a')*.86); set('b',Z.cx-w('b')*.36);
 document.body.dataset.ready='1'});
</script></body></html>
