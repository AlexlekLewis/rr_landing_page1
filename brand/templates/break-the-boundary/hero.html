<!doctype html><html><head><meta charset="utf-8">
<!-- BREAK THE BOUNDARY FESTIVAL key visual. Promotional players: Dhruv Jurel and Vaibhav Sooryavanshi only (Andy, 27 Nov 2026), large and close together, cropped
     at the thigh like broadcast key art. ?f=feed|vert|sq  &v=lights|coast -->
<style>
@font-face{font-family:M;src:url(../../fonts/montserrat-latin-900-italic.woff2);font-weight:900;font-style:italic}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:M;color:#fff;position:relative;overflow:hidden;background:#000A24;width:1080px}
.l{position:absolute}
.pl{filter:drop-shadow(-10px 0 22px rgba(225,31,143,.5)) drop-shadow(12px 0 24px rgba(40,70,255,.55)) drop-shadow(0 30px 40px rgba(0,0,0,.6)) contrast(1.08) saturate(1.1)}
.grain{inset:0;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
</style><script src="btb-logo.js"></script></head><body><script>
const q=new URLSearchParams(location.search),F=q.get('f')||'feed',V=q.get('v')||'lights';
// lw = logo width, ly = logo top, pt = top of the centre player's head, pc = centre player height
const Z={feed:{H:1350,lw:520,ly:34,pt:640,pc:1180},vert:{H:1920,lw:640,ly:236,pt:960,pc:1300},sq:{H:1080,lw:380,ly:20,pt:446,pc:1000}}[F];
document.body.style.height=Z.H+'px';
const bg=V==='coast'?'art/coast.jpg':'../launch-2027/bg/lights.jpg';
const ps=Z.pc*.9, side=Z.pc*.235; // side players sit behind the centre player's shoulders
document.body.innerHTML=`<div class="l" style="inset:0;background:url(${bg}) center ${V==='coast'?'60%':'18%'}/cover;filter:saturate(1.2) brightness(${V==='coast'?.95:.8})"></div>
<div class="l" style="inset:0;background:linear-gradient(180deg,rgba(0,10,36,.94) 0%,rgba(0,12,44,.8) ${Math.round(Z.pt/Z.H*100)-6}%,rgba(0,20,72,.1) ${Math.round(Z.pt/Z.H*100)+14}%,rgba(0,10,36,0) 80%)"></div>
<img class="l pl" id="a" src="../launch-2027/players/soorya-6645.png" style="height:${Z.pc}px;top:${Z.pt}px;z-index:3">
<img class="l pl" id="b" src="../launch-2027/players/jurel-0417.png" style="height:${Z.pc*.98}px;top:${Z.pt+Z.pc*.01}px;z-index:2">
<div class="l" style="left:0;right:0;bottom:0;height:${Math.round(Z.H*.2)}px;z-index:4;background:linear-gradient(180deg,rgba(0,10,36,0),rgba(0,10,36,.92))"></div>
<div class="l" id="lg" style="left:50%;top:${Z.ly}px;margin-left:${-Z.lw/2}px;z-index:5;filter:drop-shadow(0 10px 40px rgba(0,10,36,.7))">${btbLogo(Z.lw,{torquay:V==='coast'})}</div>
<div class="l grain" style="z-index:7"></div>`;
Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.load('italic 900 100px M')).then(()=>document.fonts.ready).then(()=>{
 const w=id=>document.getElementById(id).getBoundingClientRect().width, set=(id,x)=>document.getElementById(id).style.left=x+'px';
 const cx=650; set('a',cx-w('a')*.86); set('b',cx-w('b')*.36);
 document.body.dataset.ready='1'});
</script></body></html>
