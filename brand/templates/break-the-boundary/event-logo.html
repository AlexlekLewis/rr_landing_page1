<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(../../fonts/montserrat-latin-900-normal.woff2);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}body{width:2400px;height:900px;display:flex}
.p{width:800px;height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
</style><script src="btb-logo.js"></script></head><body><script>
const lg=c=>`<img src="../../logos/rra-melbourne-${c}.svg" style="height:150px">`;
document.body.innerHTML=`<div class="p" style="background:#001D48">${lg('white')}${btbLogo(620)}</div>
<div class="p" style="background:linear-gradient(150deg,#001D48 0%,#1226AA 42%,#E11F8F 100%)">${lg('white')}${btbLogo(620)}</div>
<div class="p" style="background:#fff">${lg('blue')}${btbLogo(620,{mode:'light'})}</div>`;
document.fonts.load('900 100px M').then(()=>document.fonts.ready).then(()=>document.body.dataset.ready='1');
</script></body></html>
