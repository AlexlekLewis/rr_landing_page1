<!doctype html><html><head><meta charset="utf-8">
<!-- Reel overlay (transparent PNG, 1080x1920). ?a=WORD&b=WORD&s=subline&end=1 for the end card. -->
<style>
@font-face{font-family:M;src:url(../../fonts/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:M;src:url(../../fonts/montserrat-latin-900-normal.woff2);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:transparent}
body{width:1080px;height:1920px;font-family:M;color:#fff;position:relative;overflow:hidden}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,29,72,.75) 0%,rgba(0,29,72,0) 28%,rgba(0,29,72,0) 45%,rgba(120,20,110,.75) 72%,rgba(225,31,143,.92) 100%)}
.end .scrim{background:linear-gradient(165deg,#001D48 0%,#E11F8F 100%)}
.logo{position:absolute;left:64px;top:242px;width:140px}
.chip{position:absolute;right:124px;top:250px;background:#E11F8F;font-weight:800;font-size:26px;letter-spacing:.06em;padding:12px 24px;border-radius:4px}
.h{position:absolute;left:64px;bottom:560px;font-weight:900;font-size:200px;line-height:.88;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;text-shadow:0 8px 40px rgba(0,0,0,.35)}
.h span{display:block}.h .p{color:#E11F8F;text-shadow:0 8px 40px rgba(0,0,0,.5)}
.s{position:absolute;left:64px;bottom:490px;font-weight:800;font-size:34px;letter-spacing:.04em;text-transform:uppercase}
.end .h{bottom:auto;top:560px;font-size:245px}.end .h .p{text-shadow:none}.end .s{bottom:auto;top:1040px}
.cta{position:absolute;left:64px;top:1140px;display:flex;height:76px}
.cta b{background:#E11F8F;font-weight:900;font-size:34px;letter-spacing:.04em;padding:0 30px;display:flex;align-items:center}
.cta i{font-style:normal;background:#001D48;font-weight:800;font-size:25px;letter-spacing:.06em;padding:0 24px;display:flex;align-items:center}
.lion{position:absolute;right:-170px;top:330px;height:1300px;opacity:.5}
.foot{position:absolute;left:0;right:0;bottom:0;height:260px;background:#001D48;padding:44px 64px 0;font-weight:900;font-size:38px;letter-spacing:.04em}
</style></head><body><script>
const q=new URLSearchParams(location.search),end=q.get('end');if(end)document.body.className='end';
document.body.innerHTML=`<div class="scrim"></div>${end?'<img class="lion" src="../../logos/lion-rampant-white.png">':''}
<img class="logo" src="../../logos/rra-melbourne-white.svg"><span class="chip">${q.get('c')||'ELITE T20 PROGRAM · 2027'}</span>
<div class="h" id="h"><span>${q.get('a')||''}</span><span class="p">${q.get('b')||''}</span></div>
${q.get('s')?`<div class="s">${q.get('s')}</div>`:''}
${end?'<div class="cta"><b>APPLY NOW</b><i>RRAMELBOURNE.COM/ELITE-ROYALS</i></div><div class="foot">HALLA BOL!</div>':''}`;
document.fonts.load('900 100px M').then(()=>document.fonts.ready).then(()=>{const h=document.getElementById('h');let f=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>892&&f>80){f-=4;h.style.fontSize=f+'px'}document.body.dataset.ready=1})
</script></body></html>
